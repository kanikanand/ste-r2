<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dotted Grid Studio</title>
    <meta name="description" content="Generate dotted grid patterns from twelve flow fields." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cg fill='%23de2027'%3E%3Ccircle cx='8' cy='8' r='1.6'/%3E%3Ccircle cx='16' cy='8' r='2.6'/%3E%3Ccircle cx='24' cy='8' r='1.6'/%3E%3Ccircle cx='8' cy='16' r='2.6'/%3E%3Ccircle cx='16' cy='16' r='4'/%3E%3Ccircle cx='24' cy='16' r='2.6'/%3E%3Ccircle cx='8' cy='24' r='1.6'/%3E%3Ccircle cx='16' cy='24' r='2.6'/%3E%3Ccircle cx='24' cy='24' r='1.6'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // This file is the dev entry: it loads /src/main.jsx as an ES module,
      // which browsers block over file://. Say so rather than going blank.
      addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (location.protocol !== 'file:' || !root || root.childElementCount) return;
          root.innerHTML =
            '<div style="font:14px/1.7 ui-monospace,Menlo,monospace;color:#eceff4;' +
            'background:#08080a;min-height:100vh;padding:48px;margin:-8px">' +
            '<h1 style="font-size:15px;letter-spacing:.14em;text-transform:uppercase">Dotted Grid Studio</h1>' +
            '<p>This page can\'t run from a <code>file://</code> URL — browsers block ES modules there.</p>' +
            '<p style="color:#8b8f9c">Run it with:</p>' +
            '<pre style="background:#16161c;border:1px solid #26262e;border-radius:4px;padding:14px">' +
            'npm install\nnpm run dev</pre>' +
            '<p style="color:#8b8f9c">…then open the http://localhost address it prints. ' +
            'Or run <code>npm run build</code> and open <code>dist/index.html</code>, ' +
            'which is a single self-contained file that does work by double-click.</p></div>';
        }, 400);
      });
    </script>
  </body>
</html>
