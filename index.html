<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STE Visual Suite</title>
<meta name="description" content="Three dotted modes — flat patterns in motion, a globe of the real world, and an orbiting particle sphere — sharing one palette, one frame and one set of exports.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<!--
  The interface face. Everything else on this page is vendored so it runs
  straight off the filesystem with no network; this is the one thing that is
  fetched, and the stack behind it in style.css is what shows when it cannot be.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="root"></div>

<!-- Vendored so the page works offline and straight off the filesystem. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.umd.js"></script>

<!-- Shared: the palette, the frames and renderer, the encoders, the widgets. -->
<script src="js/color.js"></script>
<script src="js/modes.js"></script>
<script src="js/render.js"></script>
<script src="js/gifenc.js"></script>
<script src="js/record.js"></script>

<!-- One file per mode, each registering itself with modes.js. -->
<script src="js/patterns.js"></script>
<script src="js/field.js"></script>
<script src="vendor/world-50m.js"></script>
<script src="js/geo.js"></script>
<script src="js/globe.js"></script>
<script src="js/sphere.js"></script>

<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
